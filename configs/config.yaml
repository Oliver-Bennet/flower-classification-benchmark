project:
  name: "flower-benchmark"
  seed: 42
  device: "cuda"

data:
  root: "D:\\flower-classification-benchmark\\data\\flowers"
  train_dir: "train"
  val_dir: "valid"
  test_dir: "test"

  image_size: 224
  num_classes: 102
  num_workers: 0
  pin_memory: true

  use_imagenet_stats: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    color_jitter: false
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    color_jitter_hue: 0.1

training:
  batch_size: 32
  epochs: 30
  loss: "cross_entropy"
  label_smoothing: 0.0

  optimizer:
    name: "adamw"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    momentum: 0.9
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine"
    step_size: 10
    gamma: 0.1
    T_max: 30
    eta_min: 1.0e-6
    max_lr: 1.0e-2
    pct_start: 0.3
    div_factor: 25.0
    final_div_factor: 1.0e4

  initialization:
    name: "default"

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
    monitor: "val_macro_f1"
    mode: "max"

  amp: true
  gradient_clip: null

model:
  name: "cnn"
  pretrained: false
  dropout: 0.3

  mlp:
    hidden_dims: [1024, 512]
    dropout: 0.5

  cnn:
    channels: [32, 64, 128, 256]
    kernel_size: 3
    pool_size: 2

  cnn_transformer:
    cnn_channels: [64, 128, 128]
    embed_dim: 256
    num_heads: 4
    num_layers: 2
    mlp_ratio: 4.0
    dropout: 0.1

  vit:
    patch_size: 16
    embed_dim: 384
    depth: 6
    num_heads: 6
    mlp_ratio: 4.0
    dropout: 0.1

  swin:
    variant: "swin_t"
    embed_dim: 96
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7

  convnext:
    variant: "convnext_tiny"
    drop_path_rate: 0.1

  maxvit:
    variant: "maxvit_tiny"
    drop_path_rate: 0.1

evaluation:
  metrics: ["accuracy", "macro_f1", "weighted_f1"]
  average: "macro"
  save_confusion_matrix: true

logging:
  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/checkpoints"
  figure_dir: "outputs/figures"
  result_dir: "outputs/results"
  save_every_epoch: false
  log_interval: 50

inference:
  checkpoint: null
  top_k: 3